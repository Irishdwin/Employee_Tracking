<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Registration - Onazul Workforce Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #0056b3;
            --brand-secondary: #003366;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #003366 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .register-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 100%;
        }
        .register-header {
            background: linear-gradient(135deg, #0056b3 0%, #003366 100%);
            color: white;
            padding: 2rem;
            border-radius: 1rem 1rem 0 0;
            text-align: center;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        .btn-brand {
            background: var(--brand-primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
        }
        .btn-brand:hover {
            background: var(--brand-secondary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <h3 class="mb-2"><i class="bi bi-person-plus me-2"></i>Applicant Registration</h3>
            <p class="mb-0 small opacity-90">Create your account to apply for job opportunities</p>
        </div>
        <div class="card-body p-4">
            <div id="registerAlert" class="alert d-none" role="alert"></div>
            
            <form id="registerForm" method="POST" action="../../Api/Applicant/applicant_register.php">
                <div class="mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="full_name" class="form-control" required minlength="3">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email Address *</label>
                    <div class="d-flex gap-2">
                        <input type="email" name="email" id="emailField" class="form-control" required placeholder="your@email.com">
                        <button type="button" class="btn btn-outline-primary flex-shrink-0" id="sendCodeBtn">
                            <i class="bi bi-envelope-check me-1"></i> Send Code
                        </button>
                    </div>
                    <small class="text-muted">This will be your login username. Verify your email with the 4-digit code.</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">4-Digit Verification Code *</label>
                    <input type="text" name="otp_code" id="otpCodeField" class="form-control text-center" maxlength="4" pattern="[0-9]{4}" placeholder="0000" autocomplete="one-time-code" disabled>
                    <small class="text-muted">Enter the code sent to your email. Click "Send Code" first.</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Mobile Number *</label>
                    <input type="tel" name="mobile" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" required minlength="8">
                    <small class="text-muted">Must contain: uppercase, lowercase, number, special character</small>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-brand rounded-pill">
                        <i class="bi bi-person-check me-2"></i>Create Account
                    </button>
                    <a href="../../index.html" class="btn btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-left me-2"></i>Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../Js/Applicant/applicant_register.js"></script>
</body>
</html>
