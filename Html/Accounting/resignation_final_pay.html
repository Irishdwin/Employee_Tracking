<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resignation Final Pay - Onazul Accounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #003366; --sidebar-width: 240px; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f5f7fb; }
        .layout-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); color: #fff; position: fixed; inset: 0 0 0 0; z-index: 1030; }
        .sidebar-header { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-link { display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem 1.2rem; color: #e2e8f0; text-decoration: none; }
        .sidebar-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .sidebar-link.active { background: linear-gradient(to right, #0072ff, #00c6ff); color: #fff; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 1.25rem 1.75rem; }
        .page-header-title { font-size: 1.4rem; font-weight: 600; color: #1f2933; }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header"><span>Onazul Accounting</span></div>
        <ul class="sidebar-nav mt-2">
            <li><a href="dtr_approvals.html" class="sidebar-link"><i class="bi bi-clock-history"></i><span>DTR Approvals</span></a></li>
            <li><a href="accounting_dashboard.html" class="sidebar-link"><i class="bi bi-cash-coin"></i><span>Accounting Dashboard</span></a></li>
            <li><a href="resignation_final_pay.html" class="sidebar-link active"><i class="bi bi-door-open"></i><span>Resignation Final Pay</span></a></li>
            <li><a href="../../index.html" class="sidebar-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></li>
        </ul>
    </aside>
    <main class="main-content">
        <div class="mb-4">
            <div class="page-header-title">Resignation Final Pay & Quitclaim</div>
            <div class="text-muted small">Compute final pay and prepare quitclaim for cleared resignations</div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead><tr><th>Employee</th><th>Effective</th><th>Status</th><th>Final Pay</th><th>Actions</th></tr></thead>
                        <tbody id="resignBody"><tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="quitclaimModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Upload Quitclaim</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="qcResignId">
                <label class="form-label">Quitclaim Document (PDF/Image)</label>
                <input type="file" id="qcFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnUploadQc">Upload</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '../../Api/Accounting/resignation_final_pay.php';

    function load() {
        fetch(API).then(r => r.json()).then(d => {
            const t = document.getElementById('resignBody');
            if (!d.success || !d.resignations || d.resignations.length === 0) {
                t.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No resignations ready for final pay.</td></tr>';
                return;
            }
            function fmt(n) { return n != null ? '₱' + parseFloat(n).toLocaleString('en-PH', {minimumFractionDigits: 2}) : '-'; }
            t.innerHTML = d.resignations.map(r => {
                const canCompute = r.Status === 'Clearance Complete';
                const canUpload = r.Status === 'Final Pay Ready';
                return '<tr><td>' + (r.EmployeeName||'-') + '<br><small class="text-muted">' + (r.EmployeeNumber||'') + '</small></td>' +
                    '<td>' + (r.EffectiveDate||'-') + '</td><td><span class="badge bg-info">' + (r.Status||'-') + '</span></td>' +
                    '<td>' + fmt(r.FinalPay) + '</td>' +
                    '<td>' + (canCompute ? '<button class="btn btn-sm btn-primary me-1" onclick="compute(' + r.ResignationID + ')">Compute Final Pay</button>' : '') +
                    (canUpload ? '<button class="btn btn-sm btn-success" onclick="openQuitclaim(' + r.ResignationID + ')">Upload Quitclaim</button>' : '') +
                    (r.QuitclaimDocumentPath ? '<a href="../../' + r.QuitclaimDocumentPath + '" target="_blank" class="btn btn-sm btn-outline-secondary ms-1">View</a>' : '') + '</td></tr>';
            }).join('');
        });
    }

    function compute(id) {
        const fd = new FormData();
        fd.append('action', 'compute_final_pay');
        fd.append('resignation_id', id);
        fetch(API, { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.success) { alert(d.message); load(); }
            else alert(d.message || 'Error');
        });
    }

    function openQuitclaim(id) {
        document.getElementById('qcResignId').value = id;
        document.getElementById('qcFile').value = '';
        new bootstrap.Modal(document.getElementById('quitclaimModal')).show();
    }

    document.getElementById('btnUploadQc').onclick = () => {
        const id = document.getElementById('qcResignId').value;
        const file = document.getElementById('qcFile').files[0];
        if (!file) { alert('Select a file'); return; }
        const fd = new FormData();
        fd.append('action', 'upload_quitclaim');
        fd.append('resignation_id', id);
        fd.append('quitclaim_file', file);
        fetch(API, { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.success) { bootstrap.Modal.getInstance(document.getElementById('quitclaimModal')).hide(); load(); alert(d.message); }
            else alert(d.message || 'Error');
        });
    };

    load();
</script>
</body>
</html>
