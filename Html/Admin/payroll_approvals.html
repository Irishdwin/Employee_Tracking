<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Approvals - Onazul Workforce Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../../Css/ow_widgets.css">
    <link rel="stylesheet" href="../../Css/ow_dashboard_theme.css">
    <script>window.REQUIRED_ROLE = 'Admin';</script>
    <script src="../../Js/Shared/role_guard.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Payroll Approvals &amp; Status Tracking</h2>
                <p class="text-muted">Monitor payroll run milestone stages, status history, and uploaded communication proofs.</p>
            </div>
            <a href="admin_dashboard.html" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Billing Ref No.</th>
                                <th>Client Company</th>
                                <th>Deployment Site</th>
                                <th>Cutoff Period</th>
                                <th>Employees</th>
                                <th>Total Invoice</th>
                                <th>Current Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="payrollApprovalsBody">
                            <tr><td colspan="8" class="text-center text-muted py-4">Loading payroll runs...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Js/Admin/payroll_approvals.js"></script>
</body>
</html>
