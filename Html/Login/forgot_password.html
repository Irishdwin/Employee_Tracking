<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Onazul Workforce Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../Css/login.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h3 class="mb-3 text-center">Forgot Password</h3>
                    <p class="text-muted small text-center mb-4">
                        Enter your registered email address and we will guide you to reset your password.
                    </p>

                    <div class="alert alert-info small">
                        This is a placeholder screen. You can later connect it to an email-based reset flow or
                        let HR manually reset passwords.
                    </div>

                    <form method="post" action="#">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary" disabled>
                                Send Reset Link
                            </button>
                        </div>

                        <div class="text-center">
                            <a href="../../index.html" class="small text-decoration-none">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
