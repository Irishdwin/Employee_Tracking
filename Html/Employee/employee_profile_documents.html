<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Profile & Documents</title>
  <script src="../../Js/Shared/ow_tailwind_cdn_warn_shim.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { navy: '#0A2A5E', orange: '#F97316', 'orange-dark': '#EA580C', surface: '#F3F4F6' } } } }
    };
  </script>
  <style>body { font-family: Inter, system-ui, sans-serif; }</style>
<link rel="stylesheet" href="../../Css/applicant_searchable_select.css">
</head>
<body class="min-h-screen bg-brand-surface text-slate-800">
  <header class="border-b border-slate-200 bg-brand-navy text-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <h1 class="text-lg font-bold">Employee Profile & Documents</h1>
      <a href="employee_dashboard.html" class="rounded-lg bg-white/10 px-3 py-1.5 text-sm font-semibold hover:bg-white/20">Back to Dashboard</a>
    </div>
  </header>

  <main class="mx-auto grid max-w-5xl gap-6 px-4 py-6 lg:grid-cols-3">
    <section class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-100 lg:col-span-1">
      <h2 class="text-base font-bold text-brand-navy">Personal Profile</h2>
      <dl class="mt-4 space-y-3 text-sm">
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Full name</dt><dd id="p-name" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Email</dt><dd id="p-email" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Employee Number</dt><dd id="p-empno" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Birth Date</dt><dd id="p-birth" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Home Location</dt><dd id="p-home" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Address</dt><dd id="p-address" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Job Title</dt><dd id="p-job-title" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Company Name</dt><dd id="p-company" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Job Category</dt><dd id="p-job-category" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Classification</dt><dd id="p-classification" class="font-semibold">-</dd></div>
        <div><dt class="text-xs font-semibold uppercase text-slate-500">Sub Classification</dt><dd id="p-subclassification" class="font-semibold">-</dd></div>
      </dl>
    </section>

    <section class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-100 lg:col-span-2">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-brand-navy">Uploaded Documents</h2>
        <span id="doc-count" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">0 documents</span>
      </div>

      <form id="upload-form" class="mt-4 grid gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3 sm:grid-cols-2">
        <div>
          <label for="doc_type" class="mb-1 block text-xs font-semibold uppercase text-slate-500">Document Type</label>
          <input id="doc_type" name="doc_type" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/30" value="General Document" />
        </div>
        <div>
          <label for="document" class="mb-1 block text-xs font-semibold uppercase text-slate-500">Upload File</label>
          <input id="document" name="document" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required />
        </div>
        <div class="sm:col-span-2">
          <p id="replace-hint" class="mb-2 text-sm text-brand-navy" hidden></p>
          <button id="upload-submit" type="submit" class="w-full rounded-lg bg-brand-orange py-2.5 text-sm font-bold text-white hover:bg-brand-orange-dark">Upload Document</button>
          <button type="button" id="replace-cancel" class="mt-2 text-sm font-semibold text-slate-600" hidden>Cancel replacement</button>
        </div>
      </form>

      <p id="upload-status" class="mt-3 text-sm" role="status" hidden></p>
      <ul id="doc-list" class="mt-4 space-y-2 text-sm">
        <li class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-500">No documents found.</li>
      </ul>
    </section>
  </main>

  <div id="doc-view-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="h-[80vh] w-full max-w-4xl overflow-hidden rounded-xl bg-white shadow-2xl ring-1 ring-slate-200">
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <h3 id="doc-view-title" class="text-sm font-bold text-brand-navy">Document Preview</h3>
        <button id="doc-view-close" type="button" class="rounded p-1 hover:bg-slate-100" aria-label="Close">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="h-[calc(80vh-52px)] bg-slate-100">
        <iframe id="doc-view-frame" class="h-full w-full" title="Document preview"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DATA_API = '../../Api/Employee/dashboard_data.php';
      var UPLOAD_API = '../../Api/Employee/upload_document.php';
      var uploadForm = document.getElementById('upload-form');
      var docList = document.getElementById('doc-list');
      var docCount = document.getElementById('doc-count');
      var docModal = document.getElementById('doc-view-modal');
      var docFrame = document.getElementById('doc-view-frame');
      var docTitle = document.getElementById('doc-view-title');
      var replaceId=0, csrfToken='', uploading=false;
      var uploadButton=document.getElementById('upload-submit');
      var cancelButton=document.getElementById('replace-cancel');
      var status=document.getElementById('upload-status');
      function resetReplacement() { replaceId=0; uploadForm.reset(); document.getElementById('doc_type').readOnly=false; uploadButton.textContent='Upload Document'; cancelButton.hidden=true; document.getElementById('replace-hint').hidden=true; }
      cancelButton.addEventListener('click',resetReplacement);
      function escapeHtml(value) { var el=document.createElement('span'); el.textContent=String(value); return el.innerHTML; }
      var docClose = document.getElementById('doc-view-close');

      function renderDocuments(docs) {
        var arr = Array.isArray(docs) ? docs : [];
        docCount.textContent = arr.length + (arr.length === 1 ? ' document' : ' documents');
        if (!arr.length) {
          docList.innerHTML = '<li class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-500">No documents found.</li>';
          return;
        }
        docList.innerHTML = '';
        arr.forEach(function (d) {
          var li = document.createElement('li');
          li.className = 'rounded-lg border border-slate-200 bg-white px-3 py-2';
          var name = d && d.name ? d.name : 'Document';
          var type = d && d.type ? d.type : '';
          var date = d && d.uploaded_at ? d.uploaded_at : 'Unknown date';
          var path = d && d.path ? d.path : '';
          li.innerHTML = '<div class="flex items-center justify-between gap-2"><div><p class="font-semibold text-slate-800">' + escapeHtml(name) + '</p><p class="text-xs text-slate-500">' + escapeHtml(type) + '</p></div><div class="flex items-center gap-2"><span class="text-xs text-slate-500">' + escapeHtml(date) + '</span><button type="button" class="doc-view-btn rounded-md border border-slate-300 bg-white px-2 py-1 text-xs font-semibold text-slate-700 hover:bg-slate-50" data-name="' + String(name).replace(/"/g, '&quot;') + '" data-path="' + String(path).replace(/"/g, '&quot;') + '">View</button></div></div>';
          var replace=document.createElement('button');
          replace.type='button'; replace.textContent='Replace';
          replace.className='ml-2 rounded-md border border-orange-300 bg-orange-50 px-2 py-1 text-xs font-semibold text-orange-700 hover:bg-orange-100';
          replace.addEventListener('click',function () {
            if(uploading || !d.doc_id) return;
            replaceId=d.doc_id; uploadForm.reset();
            document.getElementById('doc_type').value=type;
            document.getElementById('doc_type').readOnly=true;
            document.getElementById('replace-hint').textContent='Replacing '+name+' ('+type+'). Choose the updated file below.';
            document.getElementById('replace-hint').hidden=false;
            uploadButton.textContent='Replace Document'; cancelButton.hidden=false;
            uploadForm.scrollIntoView({behavior:'smooth',block:'center'});
            document.getElementById('document').focus();
          });
          li.querySelector('.doc-view-btn').parentElement.appendChild(replace);
          docList.appendChild(li);
        });
        docList.querySelectorAll('.doc-view-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var p = this.getAttribute('data-path') || '';
            var n = this.getAttribute('data-name') || 'Document Preview';
            if (!p) return;
            docTitle.textContent = n;
            EmployeeDocumentPreview.open(p,n);
            docModal.classList.remove('hidden');
            docModal.classList.add('flex');
          });
        });
      }

      function renderProfile(profile) {
        var p = profile || {};
        document.getElementById('p-name').textContent = p.full_name || '-';
        document.getElementById('p-email').textContent = p.email || '-';
        document.getElementById('p-empno').textContent = p.employee_number || '-';
        var ap = p.applicant_profile || {};
        document.getElementById('p-birth').textContent = ap.birth_date || '-';
        document.getElementById('p-home').textContent = ap.home_location || '-';
        document.getElementById('p-address').textContent = ap.address || '-';
        document.getElementById('p-job-title').textContent = ap.job_title || '-';
        document.getElementById('p-company').textContent = ap.company_name || '-';
        document.getElementById('p-job-category').textContent = ap.job_category || '-';
        document.getElementById('p-classification').textContent = ap.preferred_classification || '-';
        document.getElementById('p-subclassification').textContent = ap.preferred_sub_classification || '-';
      }

      async function loadData() {
        try {
          var res = await fetch(DATA_API, { credentials: 'include' });
          var data = await res.json();
          if (!data || !data.success) return;
          csrfToken=data.document_csrf_token || '';
          renderProfile(data.profile);
          renderDocuments(data.documents);
        } catch (e) {}
      }

      uploadForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        if(uploading) return;
        uploading=true; uploadButton.disabled=true; cancelButton.disabled=true;
        var fd = new FormData(uploadForm);
        fd.append('csrf_token',csrfToken);
        if(replaceId) fd.append('replace_doc_id',String(replaceId));
        try {
          var res = await fetch(UPLOAD_API, { method: 'POST', body: fd, credentials: 'include' });
          var data = await res.json();
          if (!data || !data.success) {
            status.textContent=(data && data.message) || 'Upload failed.'; status.hidden=false; status.className='mt-3 text-sm text-red-700';
            return;
          }
          resetReplacement();
          status.textContent=data.message; status.hidden=false; status.className='mt-3 text-sm text-green-700';
          await loadData();
        } catch (err) {
          status.textContent='Upload failed. Your existing document has not been changed.'; status.hidden=false; status.className='mt-3 text-sm text-red-700';
        } finally { uploading=false; uploadButton.disabled=false; cancelButton.disabled=false; }
      });

      if (docClose) {
        docClose.addEventListener('click', function () {
          docModal.classList.add('hidden');
          docModal.classList.remove('flex');
          docFrame.src = 'about:blank';
        });
      }
      if (docModal) {
        docModal.addEventListener('click', function (e) {
          if (e.target === docModal) {
            docModal.classList.add('hidden');
            docModal.classList.remove('flex');
            docFrame.src = 'about:blank';
          }
        });
      }

      document.addEventListener('employee-profile-updated',loadData);
      loadData();
    })();
  </script>
<script src="../../Js/Shared/employee_document_preview.js"></script>
<script src="../../Js/Applicant/searchable_select.js"></script>
<script src="../../Js/Applicant/applicant_profile_cascades.js"></script>
<script src="../../Js/Employee/employee_profile_edit.js"></script>
</body>
</html>
