<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opening resignation workspace · Onazul</title></head>
<body><p id="redirectStatus">Opening your dashboard resignation workspace…</p><p><a href="hr_dashboard.html#section-resignations">Open HR dashboard</a></p>
<script>
(function(){
 fetch('../../Api/Login/check_session.php',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(session){
  if(!session.success){location.replace('../../index.html');return;}
  var role=String(session.role||'').toLowerCase();
  if(role==='hr')location.replace('hr_dashboard.html#section-resignations');
  else if(role==='admin')location.replace('../Admin/admin_dashboard.html#section-resignations');
  else{document.getElementById('redirectStatus').textContent='HR or Admin access is required.';location.replace('../../index.html');}
 }).catch(function(){document.getElementById('redirectStatus').textContent='Unable to check your session. Reload this page to try again.';});
})();
</script></body></html>
