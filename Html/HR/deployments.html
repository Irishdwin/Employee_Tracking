<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployments - Onazul HR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --brand-primary: #0056b3; --sidebar-bg: #003366; --sidebar-width: 240px; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f5f7fb; }
        .layout-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); color: #fff; position: fixed; inset: 0 0 0 0; z-index: 1030; }
        .sidebar-header { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-link { display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem 1.2rem; color: #e2e8f0; text-decoration: none; }
        .sidebar-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .sidebar-link.active { background: linear-gradient(to right, #0072ff, #00c6ff); color: #fff; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 1.25rem 1.75rem; }
        .page-header-title { font-size: 1.4rem; font-weight: 600; color: #1f2933; }
        .page-header-subtitle { font-size: 0.9rem; color: #6b7280; }
    </style>
    <script>window.REQUIRED_ROLE = 'HR';</script>
    <script src="../../Js/Shared/role_guard.js"></script>
</head>
<body>
<div class="layout-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header"><span>Onazul HR</span></div>
        <ul class="sidebar-nav mt-2">
            <li><a href="hr_dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
            <li><a href="job_orders.html" class="sidebar-link"><i class="bi bi-briefcase"></i><span>Job Orders</span></a></li>
            <li><a href="applicant_review.html" class="sidebar-link"><i class="bi bi-people"></i><span>Applicant Review</span></a></li>
            <li><a href="deployments.html" class="sidebar-link active"><i class="bi bi-geo-alt"></i><span>Deployments</span></a></li>
            <li><a href="hr_dashboard.html#section-messages" class="sidebar-link"><i class="bi bi-chat-dots"></i><span>Messages (HR)</span></a></li>
            <li><a href="../../index.html" class="sidebar-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></li>
        </ul>
        <div class="sidebar-footer" style="position:absolute;bottom:0;padding:1rem;font-size:0.75rem;opacity:0.7;">HR</div>
    </aside>
    <main class="main-content">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <div class="page-header-title">Deployments</div>
                <div class="page-header-subtitle">Assign employees to Client Company, site, and Team Lead</div>
            </div>
            <button class="btn btn-primary" id="btnAddDeployment"><i class="bi bi-plus-circle me-1"></i> Assign Employee</button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Company</th>
                                <th>Position</th>
                                <th>Site</th>
                                <th>Team Lead</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="deploymentsBody">
                            <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="addDeploymentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Assign Employee to Deployment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div id="addDeploymentAlert" class="alert d-none"></div>
                <form id="addDeploymentForm">
                    <div class="mb-3">
                        <label class="form-label">Employee *</label>
                        <select name="employee_id" class="form-select" required id="selEmployee"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Client Company *</label>
                        <select name="company_id" class="form-select" required id="selCompany"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Position *</label>
                        <input type="text" name="position" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Site / Location</label>
                        <input type="text" name="location" class="form-control" placeholder="Work site address">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Team Lead</label>
                        <select name="team_lead_id" class="form-select" id="selTeamLead">
                            <option value="">None</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date *</label>
                            <input type="date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSubmitDeployment">Assign</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '../../Api/HR/deployments.php';

    function showAlert(el, msg, type) { el.className = 'alert alert-' + (type || 'danger'); el.textContent = msg; el.classList.remove('d-none'); }
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function loadSelects() {
        Promise.all([
            fetch(API + '?list=employees').then(r => r.json()),
            fetch(API + '?list=companies').then(r => r.json()),
            fetch(API + '?list=team_leads').then(r => r.json())
        ]).then(([emp, comp, tl]) => {
            const selEmp = document.getElementById('selEmployee');
            selEmp.innerHTML = '<option value="">Select employee</option>' + (emp.employees || []).map(e =>
                `<option value="${e.EmployeeID}">${esc(e.LastName + ', ' + e.FirstName)} (${e.EmployeeNumber || '-'})</option>`).join('');
            const selComp = document.getElementById('selCompany');
            selComp.innerHTML = '<option value="">Select company</option>' + (comp.companies || []).map(c =>
                `<option value="${c.CompanyID}">${esc(c.Name)}</option>`).join('');
            const selTL = document.getElementById('selTeamLead');
            selTL.innerHTML = '<option value="">None</option>' + (tl.team_leads || []).map(t =>
                `<option value="${t.UsersID}">${esc(t.FullName)}</option>`).join('');
        });
    }

    function loadDeployments() {
        fetch(API).then(r => r.json()).then(d => {
            const tbody = document.getElementById('deploymentsBody');
            if (!d.success || !d.deployments || d.deployments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No deployments yet.</td></tr>';
                return;
            }
            tbody.innerHTML = d.deployments.map(dep => `
                <tr>
                    <td><strong>${esc(dep.employee_name)}</strong><br><small class="text-muted">${esc(dep.employee_number)}</small></td>
                    <td>${esc(dep.company_name)}</td>
                    <td>${esc(dep.position)}</td>
                    <td>${esc(dep.location) || '–'}</td>
                    <td>${esc(dep.team_lead_name) || '–'}</td>
                    <td>${dep.start_date || '–'}</td>
                    <td>${dep.end_date || 'Active'}</td>
                    <td>${!dep.end_date || dep.end_date >= new Date().toISOString().slice(0,10) ? `<button class="btn btn-sm btn-outline-danger" onclick="endDeployment(${dep.deployment_id})">End</button>` : '–'}</td>
                </tr>`).join('');
        }).catch(() => { document.getElementById('deploymentsBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Failed to load.</td></tr>'; });
    }

    function endDeployment(id) {
        const end = prompt('End date (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
        if (!end) return;
        const fd = new FormData();
        fd.append('action', 'end');
        fd.append('deployment_id', id);
        fd.append('end_date', end);
        fetch(API, { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.success) { loadDeployments(); } else { alert(d.message || 'Error'); }
        });
    }

    document.getElementById('btnAddDeployment').onclick = () => {
        loadSelects();
        document.getElementById('addDeploymentForm').reset();
        document.getElementById('addDeploymentAlert').classList.add('d-none');
        new bootstrap.Modal(document.getElementById('addDeploymentModal')).show();
    };

    document.getElementById('btnSubmitDeployment').onclick = () => {
        const form = document.getElementById('addDeploymentForm');
        const fd = new FormData(form);
        fd.append('action', 'create');
        const alert = document.getElementById('addDeploymentAlert');
        fetch(API, { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.success) {
                bootstrap.Modal.getInstance(document.getElementById('addDeploymentModal')).hide();
                form.reset();
                loadDeployments();
                alert.classList.add('d-none');
            } else { showAlert(alert, d.message || 'Error'); }
        }).catch(() => showAlert(alert, 'Request failed'));
    };

    loadDeployments();
</script>
</body>
</html>
