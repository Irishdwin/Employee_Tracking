<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Messages - Onazul Workforce Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f5f7fb; }
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1rem; }
        .title { font-size: 1.4rem; font-weight: 700; color:#1f2933; }
        .sub { color:#6b7280; font-size: 0.9rem; }
        .panel { border: none; border-radius: 0.85rem; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06); background:#fff; }
        .threads { max-height: 680px; overflow:auto; }
        .thread-item { cursor:pointer; padding: 0.75rem 0.9rem; border-left: 4px solid transparent; }
        .thread-item:hover { background:#f8fafc; }
        .thread-item.active { border-left-color:#0056b3; background:#eef6ff; }
        .thread-preview { color:#6b7280; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 100%; }
        .chat-box { height: 680px; display:flex; flex-direction:column; }
        .chat-messages { flex:1; overflow:auto; padding: 0.9rem; }
        .bubble { max-width: 75%; padding: 0.65rem 0.75rem; border-radius: 1rem; margin-bottom: 0.6rem; }
        .bubble.me { background:#e6f2ff; margin-left:auto; border-bottom-right-radius: 0.3rem; }
        .bubble.hr { background:#f1f5f9; border-bottom-left-radius: 0.3rem; }
        .bubble .meta { font-size:0.75rem; color:#64748b; margin-bottom: 0.25rem; }
        .composer { border-top: 1px solid #e5e7eb; padding: 0.85rem; display:flex; gap: 0.5rem; }
        .composer textarea { resize:none; }
    </style>
    <script>window.REQUIRED_ROLES = 'Admin,HR';</script>
    <script src="../../Js/Shared/role_guard.js"></script>
</head>
<body>
<div class="page-wrap">
    <div class="mb-3">
        <div class="title"><i class="bi bi-chat-dots me-2"></i>HR Inbox</div>
        <div class="sub">Reply to applicants/teams via chat. Interview schedules also appear here.</div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="panel h-100">
                <div class="p-3 border-bottom">
                    <div class="fw-semibold">Conversations</div>
                    <div class="muted-small mt-1">Unread messages are highlighted.</div>
                </div>
                <div class="threads p-1" id="threads"></div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="panel h-100 chat-box">
                <div class="p-3 border-bottom">
                    <div class="fw-semibold" id="activeThreadTitle">Select a conversation</div>
                    <div class="sub" id="activeThreadSub">Messages will show here.</div>
                </div>
                <div class="chat-messages" id="messages"></div>
                <div class="composer">
                    <textarea id="msgInput" class="form-control" rows="2" placeholder="Type your reply…"></textarea>
                    <button class="btn btn-primary" id="btnSend"><i class="bi bi-send"></i> Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const API_THREADS = '../../Api/Common/messages_threads.php';
const API_MESSAGES = '../../Api/Common/messages_messages.php';
const API_SEND = '../../Api/Common/messages_send.php';

let state = {
  activeThreadId: null,
  threads: []
};

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function formatPreview(text) {
  return (text || '').trim();
}

function renderThreads() {
  const el = document.getElementById('threads');
  if (!el) return;
  if (!state.threads || state.threads.length === 0) {
    el.innerHTML = '<div class="text-muted p-3">No conversations yet.</div>';
    return;
  }
  el.innerHTML = state.threads.map(t => {
    const active = t.thread_id === state.activeThreadId ? 'active' : '';
    const unread = t.unread_count > 0 ? `<span class="badge bg-warning text-dark ms-2">${t.unread_count}</span>` : '';
    return `
      <div class="thread-item ${active}" data-thread-id="${t.thread_id}">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div class="fw-semibold">${esc(t.other_user_name || (t.thread_type || 'User'))}</div>
          ${unread}
        </div>
        <div class="thread-preview mt-1">${esc(formatPreview(t.last_message_text)).slice(0, 48)}</div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('.thread-item').forEach(item => {
    item.addEventListener('click', () => {
      state.activeThreadId = parseInt(item.dataset.threadId, 10);
      loadMessages();
    });
  });
}

async function loadThreads() {
  const r = await fetch(API_THREADS, { credentials: 'same-origin' });
  const d = await r.json();
  if (!d.success) throw new Error(d.message || 'Failed to load threads');
  state.threads = d.threads || [];
  renderThreads();
}

async function loadMessages() {
  if (!state.activeThreadId) {
    document.getElementById('activeThreadTitle').textContent = 'Select a conversation';
    document.getElementById('activeThreadSub').textContent = '';
    document.getElementById('messages').innerHTML = '';
    return;
  }
  const thread = state.threads.find(t => t.thread_id === state.activeThreadId);
  document.getElementById('activeThreadTitle').textContent = thread ? (thread.other_user_name || 'User') : 'Conversation';
  document.getElementById('activeThreadSub').textContent = thread && thread.thread_type ? thread.thread_type.replace(/_/g, ' ') : '';

  const r = await fetch(API_MESSAGES + '?thread_id=' + encodeURIComponent(state.activeThreadId), { credentials: 'same-origin' });
  const d = await r.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';

  if (!d.success) {
    box.innerHTML = '<div class="text-danger">Failed to load messages.</div>';
    return;
  }

  const msgs = d.messages || [];
  if (msgs.length === 0) {
    box.innerHTML = '<div class="text-muted">No messages yet.</div>';
    return;
  }

  msgs.forEach(m => {
    const mine = m.sender_user_id === window.__USER_ID__ || false;
    const bubbleCls = mine ? 'me' : 'hr';
    const sender = esc(m.sender_name || '');
    const text = esc(m.message_text || '');
    const sys = m.is_system ? '<div class="meta">System message</div>' : `<div class="meta">${sender}</div>`;
    const html = `
      <div class="bubble ${bubbleCls}">
        ${sys}
        <div class="msg">${text}</div>
      </div>
    `;
    box.insertAdjacentHTML('beforeend', html);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = (input.value || '').trim();
  if (!text) return;

  const payload = { message_text: text };
  if (state.activeThreadId) payload.thread_id = state.activeThreadId;

  const r = await fetch(API_SEND, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(payload)
  });
  const d = await r.json();
  if (!d.success) {
    alert(d.message || 'Failed to send message');
    return;
  }
  state.activeThreadId = d.thread_id || state.activeThreadId;
  input.value = '';
  await loadThreads();
  await loadMessages();
}

async function poll() {
  try {
    await loadThreads();
    if (state.activeThreadId) await loadMessages();
  } catch (e) {}
}

document.getElementById('btnSend').addEventListener('click', sendMessage);

fetch('../../Api/Login/check_session.php', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(data => { window.__USER_ID__ = data && data.user_id ? data.user_id : null; })
  .catch(() => { window.__USER_ID__ = null; });

loadThreads().then(() => loadMessages());
setInterval(poll, 15000);
</script>
</body>
</html>
