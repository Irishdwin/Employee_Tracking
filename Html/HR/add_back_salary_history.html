<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documented salary history</title>
<style>body{font:16px system-ui;background:#f3f7fb;color:#143457;margin:0}main{max-width:680px;margin:40px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:16px 0 6px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ced8e3;border-radius:6px;font:inherit}button{margin-top:20px;background:#007ebc;color:white}#notice{white-space:pre-wrap}button:disabled{opacity:.5}</style>
<main><h1>Documented salary history</h1><p>HR/Admin must confirm the rate from the employee’s documented salary agreement. This action records history and does not change current salary or finalized payroll.</p><p id="notice">Loading authorized request…</p><form hidden id="rates"><label>Effective date<input required type="date" id="effective"></label><label>End date, if applicable<input type="date" id="end"></label><label>Documented daily rate (PHP)<input required type="number" min="0.01" max="99999999.99" step="0.01" id="daily"></label><p>Hourly rate is calculated using the existing daily rate ÷ 8 rule.</p><label>Documented basis / reference<textarea required minlength="10" maxlength="2000" id="reason"></textarea></label><button>Record salary history</button></form></main>
<script>const id=new URLSearchParams(location.search).get('request_id');let token='';const api='../../Api/Common/add_back_salary_history.php';const notice=document.getElementById('notice'),form=document.getElementById('rates');async function load(){const data=await fetch(api+'?request_id='+encodeURIComponent(id),{credentials:'include',cache:'no-store'}).then(r=>r.json());if(!data.success)throw Error(data.message);token=data.csrf_token;const c=data.context;notice.textContent=c.FirstName+' '+c.LastName+' · '+c.CompanyName+' · Work date '+c.WorkDate;form.hidden=false;document.getElementById('effective').max=c.WorkDate;}load().catch(e=>notice.textContent=e.message);form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const data=await fetch(api,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-AddBack-CSRF':token},body:JSON.stringify({request_id:Number(id),effective_date:document.getElementById('effective').value,end_date:document.getElementById('end').value,daily_rate:document.getElementById('daily').value,reason:document.getElementById('reason').value})}).then(r=>r.json());if(!data.success)throw Error(data.message);notice.textContent=data.message;form.hidden=true;}catch(e){notice.textContent=e.message;button.disabled=false;}};</script></html>
